<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<title>FALK — Gold Live Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0a0e27;color:#e0e0e0;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1f3a,#0f1429);padding:20px 30px;border-bottom:2px solid #f5a623;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px}
.symbol{font-size:26px;font-weight:bold;color:#f5a623;letter-spacing:1px}
.subtitle{font-size:12px;color:#8892b0;margin-top:4px}
.price{font-size:38px;font-weight:bold;font-variant-numeric:tabular-nums}
.up{color:#00e676}.down{color:#ff5252}
.change{font-size:14px;font-variant-numeric:tabular-nums}
.status{display:flex;gap:20px;font-size:13px;color:#8892b0;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.dot-on{background:#00e676;box-shadow:0 0 10px #00e676}
.dot-off{background:#ff5252}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;padding:20px;max-width:1600px;margin:0 auto}
.card{background:#131829;border-radius:12px;padding:20px;border:1px solid #2a3050;margin-bottom:20px}
.card h3{font-size:11px;text-transform:uppercase;color:#8892b0;margin-bottom:15px;letter-spacing:1.5px;font-weight:600}
#chart{width:100%;height:340px;display:block}
.features{display:grid;grid-template-columns:1fr;gap:12px}
.feature{background:#0f1429;padding:16px 20px;border-radius:8px;border-left:4px solid #f5a623}
.feature-label{font-size:10px;color:#8892b0;text-transform:uppercase;letter-spacing:1px}
.feature-value{font-size:26px;font-weight:bold;margin-top:6px;font-variant-numeric:tabular-nums}
.log{max-height:380px;overflow-y:auto;font-family:Consolas,monospace;font-size:11.5px;background:#0a0e27;padding:8px;border-radius:8px}
.log-entry{padding:6px 8px;border-bottom:1px solid #1a1f3a;display:flex;gap:10px;align-items:flex-start}
.log-time{color:#5a6490;min-width:65px;flex-shrink:0}
.log-type{font-weight:bold;min-width:70px;flex-shrink:0;font-size:10px;padding-top:1px}
.log-info{color:#d0d5e8;flex:1;word-break:break-word}
.t-CANDLE{color:#f5a623}.t-QUALITY{color:#00e5ff}.t-FUSION{color:#bd93f9}.t-FEATURE{color:#00e676}.t-TASK{color:#ff9f43}.t-WORM{color:#ff6b9d}.t-ERROR{color:#ff5252}.t-INFO{color:#8892b0}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 6px;color:#8892b0;font-size:10px;text-transform:uppercase;border-bottom:1px solid #2a3050;letter-spacing:0.5px}
td{padding:8px 6px;border-bottom:1px solid #1a1f3a;font-family:Consolas,monospace;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:bold;text-transform:uppercase}
.b-SUCCESS,.b-PASS{background:#00e676;color:#000}
.b-INSUFFICIENT_DATA,.b-PASS_WITH_WARNINGS{background:#ffc107;color:#000}
.b-FAILED,.b-FAIL{background:#ff5252;color:#fff}
.b-SUCCESS_PARTIAL,.b-RETRYABLE_ERROR{background:#00e5ff;color:#000}
.worm-num{font-size:44px;font-weight:bold;color:#ff6b9d;font-variant-numeric:tabular-nums}
.worm-last{font-size:11px;color:#5a6490;margin-top:8px;font-family:Consolas,monospace;word-break:break-all}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="symbol">PAXG / USDT — PHYSICAL GOLD</div>
    <div class="subtitle">FALK Live Pipeline • Binance WebSocket</div>
  </div>
  <div style="text-align:right">
    <div class="price" id="price">--</div>
    <div class="change" id="change">--</div>
  </div>
  <div class="status">
    <div><span class="dot dot-off" id="ws-dot"></span>WS</div>
    <div><span class="dot dot-on"></span>Pipeline</div>
    <div><strong id="candle-count">0</strong> candles</div>
  </div>
</div>
<div class="grid">
  <div>
    <div class="card">
      <h3>Gold Price — Live Chart</h3>
      <canvas id="chart"></canvas>
    </div>
    <div class="card">
      <h3>Recent Candles</h3>
      <table>
        <thead><tr><th>Time</th><th>Open</th><th>High</th><th>Low</th><th>Close</th><th>Vol</th><th>Status</th></tr></thead>
        <tbody id="candles-table"></tbody>
      </table>
    </div>
  </div>
  <div>
    <div class="card">
      <h3>Features</h3>
      <div class="features">
        <div class="feature"><div class="feature-label">SMA 20</div><div class="feature-value" id="sma">N/A</div></div>
        <div class="feature"><div class="feature-label">RSI 14</div><div class="feature-value" id="rsi">N/A</div></div>
        <div class="feature"><div class="feature-label">ATR 14</div><div class="feature-value" id="atr">N/A</div></div>
      </div>
    </div>
    <div class="card">
      <h3>WORM Snapshots</h3>
      <div class="worm-num" id="worm-count">0</div>
      <div class="worm-last">Last: <span id="worm-last">--</span></div>
    </div>
    <div class="card">
      <h3>Event Stream</h3>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>
<script>
const candles=[],MAX=200;
const canvas=document.getElementById('chart'),ctx=canvas.getContext('2d');
function resize(){canvas.width=canvas.offsetWidth*devicePixelRatio;canvas.height=canvas.offsetHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);}
resize();window.addEventListener('resize',()=>{resize();draw();});
function draw(){
  const w=canvas.offsetWidth,h=canvas.offsetHeight;
  ctx.clearRect(0,0,w,h);
  if(candles.length<2){ctx.fillStyle='#5a6490';ctx.font='14px Segoe UI';ctx.textAlign='center';ctx.fillText('Waiting for Gold candles...',w/2,h/2);return;}
  const closes=candles.map(c=>c.close);
  const min=Math.min(...closes),max=Math.max(...closes),range=max-min||1;
  const pad=50,cw=w-pad*2,ch=h-pad*2;
  ctx.strokeStyle='#1a1f3a';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=pad+(ch/4)*i;
    ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke();
    ctx.fillStyle='#5a6490';ctx.font='10px Consolas';ctx.textAlign='left';
    ctx.fillText((max-(range/4)*i).toFixed(2),5,y+4);
  }
  const step=cw/(closes.length-1);
  const grad=ctx.createLinearGradient(0,pad,0,pad+ch);
  grad.addColorStop(0,'rgba(245,166,35,0.3)');grad.addColorStop(1,'rgba(245,166,35,0)');
  ctx.beginPath();
  closes.forEach((c,i)=>{const x=pad+i*step,y=pad+ch-((c-min)/range)*ch;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.strokeStyle='#f5a623';ctx.lineWidth=2;ctx.stroke();
  ctx.lineTo(pad+cw,pad+ch);ctx.lineTo(pad,pad+ch);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  const lx=pad+(closes.length-1)*step,ly=pad+ch-((closes[closes.length-1]-min)/range)*ch;
  ctx.beginPath();ctx.arc(lx,ly,4,0,Math.PI*2);ctx.fillStyle='#f5a623';ctx.fill();
}
function addLog(type,info){
  const log=document.getElementById('log');
  const e=document.createElement('div');e.className='log-entry';
  const t=new Date().toLocaleTimeString('en-GB',{hour12:false});
  e.innerHTML='<span class="log-time">'+t+'</span><span class="log-type t-'+type+'">'+type+'</span><span class="log-info">'+info+'</span>';
  log.insertBefore(e,log.firstChild);
  while(log.children.length>60)log.removeChild(log.lastChild);
}
function addRow(c,status){
  const tb=document.getElementById('candles-table');
  const r=document.createElement('tr');
  const t=new Date(c.eventTime).toLocaleTimeString('en-GB',{hour12:false});
  const cls='b-'+(status||'SUCCESS');
  r.innerHTML='<td>'+t+'</td><td>'+c.value.open.toFixed(2)+'</td><td>'+c.value.high.toFixed(2)+'</td><td>'+c.value.low.toFixed(2)+'</td><td>'+c.value.close.toFixed(2)+'</td><td>'+c.value.volume.toFixed(0)+'</td><td><span class="badge '+cls+'">'+status+'</span></td>';
  tb.insertBefore(r,tb.firstChild);
  while(tb.children.length>15)tb.removeChild(tb.lastChild);
}
const ws=new WebSocket('ws://'+location.host);
ws.onopen=()=>{document.getElementById('ws-dot').className='dot dot-on';addLog('INFO','Dashboard connected');};
ws.onclose=()=>{document.getElementById('ws-dot').className='dot dot-off';addLog('ERROR','Disconnected');};
ws.onmessage=(e)=>{
  const m=JSON.parse(e.data);
  if(m.type==='candle'){
    candles.push(m.data);if(candles.length>MAX)candles.shift();
    const prev=candles.length>1?candles[candles.length-2].close:undefined;
    const p=document.getElementById('price'),ch=document.getElementById('change');
    p.textContent='$'+m.data.value.close.toFixed(2);
    if(prev!==undefined){
      const d=m.data.value.close-prev,pct=(d/prev)*100;
      ch.textContent=(d>=0?'+':'')+d.toFixed(2)+' ('+pct.toFixed(2)+'%)';
      ch.className='change '+(d>=0?'up':'down');
      p.className='price '+(d>=0?'up':'down');
    }
    document.getElementById('candle-count').textContent=candles.length;
    draw();addRow(m.data,m.status||'SUCCESS');
    addLog('CANDLE',m.data.symbol+' C='+m.data.value.close.toFixed(2));
  }
  if(m.type==='feature'){const el=document.getElementById(m.data.name);el.textContent=m.data.value===null?'N/A':Number(m.data.value).toFixed(2);addLog('FEATURE',m.data.name.toUpperCase()+' = '+(m.data.value===null?'N/A':m.data.value.toFixed(2)));}
  if(m.type==='quality')addLog('QUALITY','status='+m.data.status+' suitable='+m.data.suitable);
  if(m.type==='fusion')addLog('FUSION','value='+m.data.value+' conflict='+m.data.conflict);
  if(m.type==='task')addLog('TASK',m.data.state+' / '+m.data.exec);
  if(m.type==='worm'){document.getElementById('worm-count').textContent=m.data.total;document.getElementById('worm-last').textContent=m.data.id;addLog('WORM','snapshot saved #'+m.data.total);}
  if(m.type==='error')addLog('ERROR',m.data.message);
};
addLog('INFO','Waiting for Gold data...');
</script>
</body>
</html>
