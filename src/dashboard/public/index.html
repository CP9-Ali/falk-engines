<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FALK · Gold Market Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <h1>FALK · Gold Market Dashboard</h1>
      <div class="subtitle">XAUUSD · session-aware · DST-correct</div>
    </div>
    <div class="status">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-status">connecting…</span>
    </div>
  </header>

  <section class="grid">
    <div class="card">
      <div class="label">Session</div>
      <div class="value" id="session-name">—</div>
      <div class="sub" id="session-status">—</div>
    </div>
    <div class="card">
      <div class="label">Next event</div>
      <div class="value" id="next-event">—</div>
      <div class="sub" id="next-event-sub">—</div>
    </div>
    <div class="card">
      <div class="label">Week open (UTC)</div>
      <div class="value mono" id="open-utc">—</div>
    </div>
    <div class="card">
      <div class="label">Week close (UTC)</div>
      <div class="value mono" id="close-utc">—</div>
    </div>
  </section>

  <section class="grid">
    <div class="card">
      <div class="label">Last tick</div>
      <div class="value mono" id="last-tick">—</div>
      <div class="sub" id="last-tick-source">—</div>
    </div>
    <div class="card">
      <div class="label">Candles received</div>
      <div class="value" id="candle-count">0</div>
    </div>
    <div class="card">
      <div class="label">Quality</div>
      <div class="value" id="quality-status">—</div>
    </div>
    <div class="card">
      <div class="label">WS clients</div>
      <div class="value" id="client-count">0</div>
    </div>
  </section>

  <section>
    <h2>Recent events</h2>
    <ul id="events"><li class="empty">waiting for events…</li></ul>
  </section>

  <script src="/app.js"></script>
</body>
</html>
